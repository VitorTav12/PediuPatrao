<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    </head>
    <body>
        <div th:fragment="sidebar">
            <div id="sidebar">
                <h4 class="text-center py-3 mb-0">Pediu Patrão</h4>

                <div class="text-center px-3 pb-3 mb-2 border-bottom border-secondary" th:if="${usuarioLogado != null}">
                    <div>
                        <i class="bi bi-person-circle"></i>
                        Olá, <strong th:text="${usuarioLogado}"></strong>
                    </div>
                    <span class="badge bg-secondary mt-1" th:if="${perfilLogado != null}" th:text="${perfilLogado}"></span>
                </div>

                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}" aria-current="page">
                            <i class="bi bi-house"></i><span class="d-none d-md-inline">&nbsp;Home</span>
                        </a>
                    </li>
                    <li class="nav-item" th:if="${perfilLogado == 'ADMIN' or perfilLogado == 'GERENTE'}">
                        <a class="nav-link" th:href="@{/admin}">
                            <i class="bi bi-speedometer2"></i><span class="d-none d-md-inline">&nbsp;Dashboard</span>
                        </a>
                    </li>
                    <li class="nav-item" th:if="${perfilLogado == 'GERENTE' or perfilLogado == 'ATENDENTE'}">
                        <a class="nav-link" th:href="@{/clientes}">
                            <i class="bi bi-person-raised-hand"></i><span class="d-none d-md-inline">&nbsp;Clientes</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/pedidos}">
                            <i class="bi bi-bag"></i><span class="d-none d-md-inline">&nbsp;Pedidos</span>
                        </a>
                    </li>
                    <li class="nav-item" th:if="${perfilLogado == 'ADMIN' or perfilLogado == 'GERENTE'}">
                        <a class="nav-link" th:href="@{/auditoria}">
                            <i class="bi bi-shield-check"></i><span class="d-none d-md-inline">&nbsp;Auditoria</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="toggleSubmenu(event, this)">
                            <i class="bi bi-gear"></i><span class="d-none d-md-inline">&nbsp;Configurações</span>
                            <span class="float-end">&#9662;</span>
                        </a>
                        <ul class="nav flex-column submenu">
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/funcionarios}">
                                    <i class="bi bi-person-walking"></i><span class="d-none d-md-inline">&nbsp;Funcionários</span>
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/entregadores}">
                                    <i class="bi bi-bicycle"></i><span class="d-none d-md-inline">&nbsp;Entregadores</span>
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/horarios}">
                                    <i class="bi bi-clock"></i><span class="d-none d-md-inline">&nbsp;Horário de Funcionamento</span>
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/produtos}">
                                    <i class="bi bi-boxes"></i><span class="d-none d-md-inline">&nbsp;Produtos</span>
                                </a>
                            </li>
                            <li class="nav-item" th:if="${perfilLogado == 'ADMIN'}">
                                <a class="nav-link" th:href="@{/usuarios}">
                                    <i class="bi bi-people-fill"></i><span class="d-none d-md-inline">&nbsp;Usuários</span>
                                </a>
                            </li>
                        </ul>
                    </li>
                </ul>
                <form th:action="@{/logout}" method="post" class="px-3 mt-3">
                    <button type="submit" class="btn btn-outline-light w-100">
                        <i class="bi bi-box-arrow-right"></i><span class="d-none d-md-inline">&nbsp;Sair</span>
                    </button>
                </form>
            </div>
        </div>
    </body>
</html>
