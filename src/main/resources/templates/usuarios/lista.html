<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Painel de Usuários</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0 text-dark">
            <i class="bi bi-people-fill me-2 text-primary"></i>Controle de Usuários
        </h2>
        <a href="/usuarios/novo" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i> Cadastrar Novo
        </a>
    </div>

    <!-- Alertas de Notificação -->
    <div class="alert alert-success alert-dismissible fade show shadow-sm" th:if="${sucesso}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show shadow-sm" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Listagem em Tabela -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th scope="col" class="ps-4">Item</th>
                        <th scope="col">Identificação (Username)</th>
                        <th scope="col">Perfil Atribuído</th>
                        <th scope="col" class="text-end pe-4">Gerenciamento</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Caso a lista esteja vazia -->
                    <tr th:if="${#lists.isEmpty(usuarios)}">
                        <td colspan="4" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-2 d-block mb-2 text-secondary"></i>
                            Nenhum registro de usuário encontrado.
                        </td>
                    </tr>
                    <!-- Linhas de registros -->
                    <tr th:each="usr, iter : ${usuarios}">
                        <td class="ps-4 text-muted" th:text="${iter.index + 1}"></td>
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <div class="circulo-avatar">
                                    <span th:text="${#strings.toUpperCase(#strings.substring(usr.username, 0, 1))}"></span>
                                </div>
                                <span class="fw-medium text-dark" th:text="${usr.username}"></span>
                            </div>
                        </td>
                        <td>
                            <span class="badge px-2 py-1"
                                  th:classappend="${usr.role?.name() == 'ADMIN'} ? 'bg-danger' : 'bg-secondary'"
                                  th:text="${usr.role}">
                            </span>
                        </td>
                        <td class="text-end pe-4">
                            <a th:href="@{/usuarios/editar/{id}(id=${usr.id})}"
                               class="btn btn-sm btn-outline-primary me-1">
                                <i class="bi bi-pencil-fill"></i> Editar
                            </a>
                            <form th:action="@{/usuarios/deletar/{id}(id=${usr.id})}"
                                  method="post" class="d-inline"
                                  onsubmit="return confirm('Confirma a remoção definitiva deste usuário?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash-fill"></i> Remover
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer bg-light text-muted small py-3" th:if="${!#lists.isEmpty(usuarios)}">
            Total cadastrado: <strong th:text="${#lists.size(usuarios)}"></strong> usuário(s) ativo(s)
        </div>
    </div>

    <style>
        .circulo-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #0d6efd15;
            color: #0d6efd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.9rem;
            flex-shrink: 0;
        }
    </style>

</div>

</body>
</html>
