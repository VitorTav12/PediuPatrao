<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cadastro de Produto</title>
</head>
<body>
<div th:fragment="content">

    <div class="d-flex align-items-center gap-3 mb-4">
        <a href="/produtos" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h2 class="fw-bold mb-0">
            <i class="bi bi-box-seam me-2 text-primary"></i>
            <span th:text="${produto.id == null ? 'Novo Produto no Cardápio' : 'Editar Produto'}"></span>
        </h2>
    </div>

    <div class="card shadow-sm border-0" style="max-width: 600px;">
        <div class="card-body p-4">
            <form th:action="@{/produtos/salvar}" th:object="${produto}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                    <label for="nome" class="form-label fw-semibold">Nome do Produto</label>
                    <input type="text" id="nome" class="form-control" th:field="*{nome}" placeholder="Ex: Pizza Margherita" required />
                </div>

                <div class="mb-3">
                    <label for="tipo" class="form-label fw-semibold">Categoria / Tipo</label>
                    <input type="text" id="tipo" class="form-control" th:field="*{tipo}" placeholder="Ex: Pizzas Salgadas" required />
                </div>

                <div class="mb-3">
                    <label for="preco" class="form-label fw-semibold">Preço Unitário (R$)</label>
                    <div class="input-group">
                        <span class="input-group-text">R$</span>
                        <input type="number" id="preco" class="form-control" th:field="*{preco}" step="0.01" placeholder="0.00" required />
                    </div>
                </div>

                <div class="mb-4">
                    <label for="ativo" class="form-label fw-semibold">Observações / Estado</label>
                    <textarea id="ativo" class="form-control" th:field="*{ativo}" rows="2" placeholder="Detalhes adicionais do produto..."></textarea>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i> Salvar Produto
                    </button>
                    <a href="/produtos" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
