<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Gerenciar Produtos</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body>
        <div th:fragment="content" class="container mt-5">
            <h1 class="mb-4">Gestão de Produtos</h1>

            <button type="button" id="botaoNovoProduto" class="btn btn-primary mb-3" data-bs-toggle="collapse" data-bs-target="#formularioProduto">
                Novo Produto
            </button>

            <div class="collapse" id="formularioProduto">
                <div class="card card-body">
                    <h5 id="tituloFormProduto" class="mb-3">Novo produto</h5>
                    <form id="produtoForm">
                        <input type="hidden" id="produtoId">

                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome do Produto</label>
                            <input type="text" id="nome" name="nome" class="form-control" placeholder="Nome do Produto" required>
                        </div>

                        <div class="mb-3">
                            <label for="tipo" class="form-label">Tipo do Produto</label>
                            <select id="tipo" name="tipo" class="form-select" required>
                                <option value="" disabled selected>Selecione o Tipo</option>
                                <option value="Pizza">Pizza</option>
                                <option value="Lanche">Lanche</option>
                                <option value="Bebida">Bebida</option>
                                <option value="Porção">Porção</option>
                                <option value="Adicional">Adicional</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="preco" class="form-label">Preço</label>
                            <input type="number" id="preco" name="preco" class="form-control" placeholder="Preço (R$)" step="0.01" min="0" required>
                        </div>

                        <div class="form-check mb-3">
                            <input type="checkbox" id="ativo" name="ativo" class="form-check-input">
                            <label for="ativo" class="form-check-label">Produto Ativo</label>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <button type="button" id="cancelarEdicaoProduto" class="btn btn-outline-secondary d-none">Cancelar edição</button>
                            <button type="submit" class="btn btn-success">Salvar</button>
                        </div>
                    </form>
                </div>
            </div>

            <table class="table table-bordered table-striped mt-3">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Tipo</th>
                        <th>Preço</th>
                        <th>Ativo</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="produto : ${produtos}">
                        <td th:text="${produto.id}"></td>
                        <td th:text="${produto.nome}"></td>
                        <td th:text="${produto.tipo}"></td>
                        <td th:text="${#numbers.formatDecimal(produto.preco, 1, 'COMMA', 2, 'POINT')}"></td>
                        <td th:text="${produto.ativo ? 'Sim' : 'Não'}">Sim</td>
                        <td>
                            <button type="button"
                                    class="btn btn-warning btn-sm btn-editar"
                                    th:attr="data-id=${produto.id},data-nome=${produto.nome},data-tipo=${produto.tipo},data-preco=${produto.preco},data-ativo=${produto.ativo}">
                                Editar
                            </button>
                            <button type="button" class="btn btn-danger btn-sm btn-excluir" th:attr="data-id=${produto.id}">
                                Excluir
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <script th:src="@{/js/script.js}"></script>
    </body>
</html>
