<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Pedidos</title>
</head>
<body>
<div th:fragment="content">
    <input type="hidden" id="csrfToken" th:value="${_csrf.token}">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-bag me-2 text-primary"></i>Gestão de Pedidos
        </h2>
        <a th:href="@{/pedidos/novo}" class="btn btn-primary">
            <i class="bi bi-plus-circle me-1"></i>
            Novo pedido
        </a>
    </div>

    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div id="mensagemAcao"></div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark text-uppercase fs-7">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Cliente</th>
                        <th>Itens</th>
                        <th>Desconto</th>
                        <th>Total</th>
                        <th>Responsável</th>
                        <th>Entrada</th>
                        <th>Saída</th>
                        <th>Status</th>
                        <th class="text-center">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(pedidos)}">
                        <td colspan="10" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                            Nenhum pedido encontrado no sistema.
                        </td>
                    </tr>
                    <tr th:each="pedido : ${pedidos}" th:attr="data-pedido-id=${pedido.id}">
                        <td class="ps-4 text-muted font-monospace small" th:text="${#strings.abbreviate(pedido.id, 8)}"></td>
                        <td class="fw-semibold" th:text="${nomesClientes[pedido.clienteId] ?: 'Cliente não encontrado'}"></td>
                        <td>
                            <ul class="mb-0 ps-3 small text-secondary" th:if="${pedido.itens != null}">
                                <li th:each="item : ${pedido.itens}">
                                    <span class="fw-medium text-dark" th:text="${item.descricaoProduto}"></span>
                                    (<span th:text="${item.qtd}"></span>x 
                                    R$ <span th:text="${#numbers.formatDecimal(item.valorUnitario, 1, 2)}"></span>)
                                </li>
                            </ul>
                        </td>
                        <td>
                            <span class="text-danger fw-semibold" th:if="${pedido.valorDesconto != null and pedido.valorDesconto > 0}"
                                  th:text="${'R$ ' + #numbers.formatDecimal(pedido.valorDesconto, 1, 2, 'COMMA')}"></span>
                            <span class="text-muted" th:if="${pedido.valorDesconto == null or pedido.valorDesconto == 0}">R$ 0,00</span>
                            <small class="text-muted d-block" th:if="${pedido.percentualDesconto != null and pedido.percentualDesconto > 0}"
                                   th:text="${#numbers.formatDecimal(pedido.percentualDesconto, 1, 0) + '% OFF'}"></small>
                        </td>
                        <td class="fw-bold text-success" th:text="${'R$ ' + #numbers.formatDecimal(pedido.valorTotal, 1, 2)}"></td>
                        <td class="small text-muted" th:text="${pedido.responsavelId}"></td>
                        <td class="small text-muted" th:text="${pedido.horarioEntrada != null ? #temporals.format(pedido.horarioEntrada, 'dd/MM/HH:mm') : '-'}"></td>
                        <td class="small text-muted" th:text="${pedido.responsavelSaidaId != null ? pedido.responsavelSaidaId : '-'}"></td>
                        <td class="small text-muted" th:text="${pedido.horarioSaida != null ? #temporals.format(pedido.horarioSaida, 'dd/MM/HH:mm') : '-'}"></td>

                        <td>
                            <span class="badge px-2 py-1"
                                  th:classappend="${pedido.status.name() == 'FINALIZADO'} ? 'bg-success' :
                                              (${pedido.status.name() == 'CANCELADO'} ? 'bg-danger' :
                                              (${pedido.status.name() == 'EM_PREPARO'} ? 'bg-warning text-dark' :
                                              (${pedido.status.name() == 'SAIU_PARA_ENTREGA'} ? 'bg-info text-dark' :
                                              (${pedido.status.name() == 'RETIRADO'} ? 'bg-primary' : 'bg-secondary'))))"
                                  th:text="${pedido.status}">
                            </span>
                        </td>
                        <td class="text-center">
                            <div class="d-flex flex-column gap-1 align-items-center">
                                <button type="button"
                                        class="btn btn-sm btn-outline-primary btn-avancar-status w-100"
                                        th:if="${pedido.status.name() == 'RECEBIDO'}"
                                        th:attr="data-proximo-status='EM_PREPARO',data-pedido-id=${pedido.id}">
                                    Avançar p/ Preparo
                                </button>
                                <button type="button"
                                        class="btn btn-sm btn-outline-primary btn-avancar-status w-100"
                                        th:if="${pedido.status.name() == 'EM_PREPARO'}"
                                        th:attr="data-proximo-status='PRONTO',data-pedido-id=${pedido.id}">
                                    Marcar Pronto
                                </button>
                                <div class="d-flex flex-column gap-1 w-100" th:if="${pedido.status.name() == 'PRONTO'}">
                                    <button type="button"
                                            class="btn btn-sm btn-outline-primary btn-avancar-status"
                                            th:attr="data-proximo-status='SAIU_PARA_ENTREGA',data-pedido-id=${pedido.id}">
                                        Saída p/ Entrega
                                    </button>
                                    <button type="button"
                                            class="btn btn-sm btn-outline-primary btn-avancar-status"
                                            th:attr="data-proximo-status='RETIRADO',data-pedido-id=${pedido.id}">
                                        Retirado
                                    </button>
                                </div>
                                <button type="button"
                                        class="btn btn-sm btn-outline-success btn-avancar-status w-100"
                                        th:if="${pedido.status.name() == 'SAIU_PARA_ENTREGA' or pedido.status.name() == 'RETIRADO'}"
                                        th:attr="data-proximo-status='FINALIZADO',data-pedido-id=${pedido.id}">
                                    Finalizar
                                </button>
                                <span class="text-muted small"
                                      th:if="${pedido.status.name() == 'FINALIZADO' or pedido.status.name() == 'CANCELADO'}">
                                    Concluído
                                </span>

                                <div th:if="${ehGerente
                                            and pedido.status.name() != 'CANCELADO'
                                            and pedido.status.name() != 'SAIU_PARA_ENTREGA'
                                            and pedido.status.name() != 'RETIRADO'
                                            and pedido.status.name() != 'FINALIZADO'}"
                                     class="mt-2 w-100 border-top pt-2">

                                    <button type="button"
                                            class="btn btn-sm btn-outline-danger btn-cancelar-pedido w-100 mb-1"
                                            th:attr="data-pedido-id=${pedido.id}">
                                        <i class="bi bi-x-circle me-1"></i> Cancelar
                                    </button>

                                    <form class="form-desconto">
                                        <div class="input-group input-group-sm">
                                            <input type="number"
                                                   name="percentual"
                                                   class="form-control"
                                                   min="0.01"
                                                   max="20"
                                                   step="0.01"
                                                   placeholder="Desconto %"
                                                   required>
                                            <button type="submit" class="btn btn-outline-success">
                                                Aplicar
                                            </button>
                                        </div>
                                        <input type="hidden" name="pedidoId" th:value="${pedido.id}" />
                                    </form>
                                </div>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer bg-light text-muted small py-3" th:if="${!#lists.isEmpty(pedidos)}">
            Total de registos encontrados: <strong th:text="${#lists.size(pedidos)}"></strong> pedido(s)
        </div>
    </div>

    <div class="modal fade" id="modalCancelamento" tabindex="-1" aria-hidden="true">
    </div>

    <script>
        (() => {
            const csrfToken = document.getElementById("csrfToken")?.value;
            const mensagemAcao = document.getElementById("mensagemAcao");

            function mostrarMensagem(texto, tipo = "danger") {
                mensagemAcao.replaceChildren();
                const alerta = document.createElement("div");
                alerta.className = `alert alert-${tipo} mb-0 mt-2`;
                alerta.textContent = texto;
                mensagemAcao.appendChild(alerta);
            }

            document.querySelectorAll(".btn-cancelar-pedido").forEach(botao => {
                botao.addEventListener("click", async () => {
                    const pedidoId = botao.dataset.pedidoId;
                    const justificativa = window.prompt("Informe o motivo do cancelamento:");
                    if (justificativa === null || !justificativa.trim()) {
                        if (justificativa !== null) mostrarMensagem("Informe a justificativa do cancelamento.");
                        return;
                    }
                    botao.disabled = true;
                    try {
                        const parametros = new URLSearchParams({ justificativa: justificativa.trim() });
                        const resposta = await fetch(`/api/pedidos/${pedidoId}/cancelamento?${parametros}`, {
                            method: "PUT",
                            credentials: "same-origin",
                            headers: { "X-XSRF-TOKEN": csrfToken }
                        });
                        if (!resposta.ok) throw new Error(await resposta.text() || "Erro ao cancelar pedido.");
                        window.location.reload();
                    } catch (erro) {
                        mostrarMensagem(erro.message);
                        botao.disabled = false;
                    }
                });
            });

            document.querySelectorAll(".btn-avancar-status").forEach(botao => {
                botao.addEventListener("click", async () => {
                    const pedidoId = botao.dataset.pedidoId;
                    const proximoStatus = botao.dataset.proximoStatus;
                    botao.disabled = true;
                    try {
                        const resposta = await fetch(`/api/pedidos/${pedidoId}/status?status=${proximoStatus}`, {
                            method: "PUT",
                            credentials: "same-origin",
                            headers: { "X-XSRF-TOKEN": csrfToken }
                        });
                        if (!resposta.ok) throw new Error(await resposta.text() || "Erro ao atualizar status.");
                        window.location.reload();
                    } catch (erro) {
                        mostrarMensagem(erro.message);
                        botao.disabled = false;
                    }
                });
            });

            document.querySelectorAll(".form-desconto").forEach(form => {
                form.addEventListener("submit", async event => {
                    event.preventDefault();
                    const pedidoId = form.querySelector('[name="pedidoId"]').value;
                    const percentual = form.querySelector('[name="percentual"]').value;
                    const botao = form.querySelector('button[type="submit"]');
                    botao.disabled = true;
                    try {
                        const parametros = new URLSearchParams({ percentual });
                        const resposta = await fetch(`/api/pedidos/${pedidoId}/desconto?${parametros}`, {
                            method: "PUT",
                            credentials: "same-origin",
                            headers: { "X-XSRF-TOKEN": csrfToken }
                        });
                        if (!resposta.ok) throw new Error(await resposta.text() || "Erro ao aplicar desconto.");
                        window.location.reload();
                    } catch (erro) {
                        mostrarMensagem(erro.message);
                        botao.disabled = false;
                    }
                });
            });
        })();
    </script>
</div>
</body>
</html>
